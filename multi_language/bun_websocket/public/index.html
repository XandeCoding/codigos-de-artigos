<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A real-time chat application built with Bun, WebSockets, and a premium glassmorphism UI.">
    <title>Bun WebSocket Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <div class="glass-panel main-chat">
            <header class="chat-header">
                <h1>Bun Chat</h1>
                <div class="status">
                    <span id="connection-status" class="status-indicator disconnected"></span>
                    <span id="status-text">Disconnected</span>
                </div>
            </header>

            <div id="login-screen" class="active">
                <div class="login-box">
                    <h2>Welcome</h2>
                    <p>Enter a username to join the chat</p>
                    <input type="text" id="username-input" placeholder="Your Username..." autocomplete="off">
                    <button id="join-btn" class="btn primary-btn">Join Chat</button>
                </div>
            </div>

            <div id="chat-screen">
                <div id="messages-container" class="messages-area">
                    <!-- Messages will be injected here -->
                </div>
                <form id="message-form" class="input-area">
                    <input type="text" id="message-input" placeholder="Type your message..." autocomplete="off" disabled>
                    <button type="submit" id="send-btn" class="btn icon-btn" disabled>
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                    </button>
                </form>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
